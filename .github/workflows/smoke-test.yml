name: AI-FUSION model smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: pytest -q
      - name: Synthetic smoke test
        run: python -m src.aifusion.train --config configs/model.yaml --smoke-test
